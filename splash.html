<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CraftRuv – Loading…</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0b0b0f; color: #e5e7eb; font-family: -apple-system, Inter, Segoe UI, Roboto, sans-serif; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
      .logo { font-size: 22px; letter-spacing: 0.3px; font-weight: 600; }
      .sub { opacity: 0.7; font-size: 13px; }
      .spinner { width: 44px; height: 44px; border: 4px solid rgba(255,255,255,0.15); border-top-color: #7c3aed; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner"></div>
      <div class="logo">CraftRuv</div>
      <div class="sub">Starting services…</div>
    </div>
  </body>
  </html>
